<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Update - Expense Tracker</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<header class="navbar">

    <a href="index.html" class="logo">

        <div class="logo-icon">
            ET
        </div>

        <span>Expense Tracker</span>

    </a>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="update.html" class="active">
            Update
        </a>

    </nav>

</header>


<main class="container">


    <section class="welcome">

        <p class="label">
            MANAGE
        </p>

        <h1>
            Update Expenses
        </h1>

        <p>
            Add or remove your expenses.
        </p>

    </section>


    <!-- SALARY -->

    <section class="update-card">

        <div class="section-title">

            <div>

                <p class="label">
                    INCOME
                </p>

                <h2>
                    Monthly Salary
                </h2>

            </div>

        </div>


        <div class="form-row">

            <div class="input-group">

                <label>
                    Salary
                </label>

                <input
                    type="number"
                    id="salaryInput"
                    placeholder="35000"
                    min="0"
                >

            </div>


            <button
                id="saveSalary"
                class="primary-btn">

                Save Salary

            </button>

        </div>

    </section>


    <!-- ADD EXPENSE -->

    <section class="update-card">

        <div class="section-title">

            <div>

                <p class="label">
                    EXPENSE
                </p>

                <h2>
                    Add Expense
                </h2>

            </div>

        </div>


        <form id="expenseForm"
              class="form-row">


            <div class="input-group">

                <label>
                    Expense Name
                </label>

                <input
                    type="text"
                    id="expenseName"
                    placeholder="Food"
                    required
                >

            </div>


            <div class="input-group">

                <label>
                    Amount
                </label>

                <input
                    type="number"
                    id="expenseAmount"
                    placeholder="500"
                    min="1"
                    required
                >

            </div>


            <button class="primary-btn">

                Add Expense

            </button>


        </form>

    </section>


    <!-- EXPENSE LIST -->

    <section class="update-card">

        <div class="section-title">

            <div>

                <p class="label">
                    MANAGE
                </p>

                <h2>
                    Your Expenses
                </h2>

            </div>

        </div>


        <div id="expensesAdmin"
             class="admin-list">
        </div>

    </section>


</main>


<script type="module"
        src="app.js">
</script>

</body>

</html>
