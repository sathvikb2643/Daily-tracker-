<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update - Daily Tracker</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        <div class="logo-icon">DT</div>
        <span>Daily Tracker</span>
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="update.html" class="active">Update</a>
    </nav>

</header>


<main class="container">

    <section class="welcome">

        <div>
            <p class="small-title">MANAGE DATA</p>
            <h1>Update Tracker</h1>
            <p>Add, edit or remove your daily information.</p>
        </div>

    </section>


    <!-- SALARY -->

    <section class="update-card">

        <div class="section-title">
            <div>
                <p class="label">FINANCE</p>
                <h2>Salary</h2>
            </div>
        </div>

        <div class="form-row">

            <div class="input-group">

                <label>Monthly Salary</label>

                <input
                    type="number"
                    id="salaryInput"
                    placeholder="Example: 35000"
                >

            </div>

            <button onclick="updateSalary()" class="primary-btn">
                Save Salary
            </button>

        </div>

    </section>


    <!-- EXPENSES -->

    <section class="update-card">

        <div class="section-title">

            <div>
                <p class="label">FINANCE</p>
                <h2>Expenses</h2>
            </div>

        </div>


        <form id="expenseForm" class="form-row">

            <div class="input-group">

                <label>Expense Name</label>

                <input
                    type="text"
                    id="expenseName"
                    placeholder="Food"
                    required
                >

            </div>


            <div class="input-group">

                <label>Amount</label>

                <input
                    type="number"
                    id="expenseAmountInput"
                    placeholder="500"
                    required
                >

            </div>


            <button class="primary-btn">
                Add Expense
            </button>

        </form>


        <div id="expensesAdmin" class="admin-list"></div>

    </section>


    <!-- LEAVES -->

    <section class="update-card">

        <div class="section-title">

            <div>
                <p class="label">WORK</p>
                <h2>Leaves</h2>
            </div>

        </div>


        <div class="form-row">

            <div class="input-group">

                <label>Total Leaves</label>

                <input
                    type="number"
                    id="totalLeaves"
                    min="0"
                >

            </div>


            <div class="input-group">

                <label>Used Leaves</label>

                <input
                    type="number"
                    id="usedLeavesInput"
                    min="0"
                >

            </div>


            <button onclick="updateLeaves()" class="primary-btn">
                Save Leaves
            </button>

        </div>

    </section>


    <!-- HOLIDAYS -->

    <section class="update-card">

        <div class="section-title">

            <div>
                <p class="label">CALENDAR</p>
                <h2>Holidays</h2>
            </div>

        </div>


        <form id="holidayForm" class="form-row">

            <div class="input-group">

                <label>Holiday Name</label>

                <input
                    type="text"
                    id="holidayName"
                    placeholder="Independence Day"
                    required
                >

            </div>


            <div class="input-group">

                <label>Date</label>

                <input
                    type="date"
                    id="holidayDate"
                    required
                >

            </div>


            <button class="primary-btn">
                Add Holiday
            </button>

        </form>


        <div id="holidaysAdmin" class="admin-list"></div>

    </section>


    <!-- TASKS -->

    <section class="update-card">

        <div class="section-title">

            <div>
                <p class="label">PRODUCTIVITY</p>
                <h2>Planned Tasks</h2>
            </div>

        </div>


        <form id="taskForm" class="form-row">

            <div class="input-group">

                <label>Task</label>

                <input
                    type="text"
                    id="taskName"
                    placeholder="Complete Python practice"
                    required
                >

            </div>


            <div class="input-group">

                <label>Date</label>

                <input
                    type="date"
                    id="taskDate"
                    required
                >

            </div>


            <button class="primary-btn">
                Add Task
            </button>

        </form>


        <div id="tasksAdmin" class="admin-list"></div>

    </section>

</main>


<script src="app.js"></script>

</body>

</html>
