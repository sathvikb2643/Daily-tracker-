<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">

        <div class="logo-icon">
            ET
        </div>

        <span>Expense Tracker</span>

    </a>

    <nav>

        <a href="index.html" class="active">
            Home
        </a>

        <a href="update.html">
            Update
        </a>

    </nav>

</header>


<main class="container">

    <section class="welcome">

        <p class="label">
            PERSONAL FINANCE
        </p>

        <h1>
            My Expenses
        </h1>

        <p id="currentDate"></p>

    </section>


    <!-- SUMMARY -->

    <section class="summary-grid">

        <div class="summary-card">

            <span>
                Monthly Salary
            </span>

            <strong id="salaryAmount">
                ₹0
            </strong>

        </div>


        <div class="summary-card">

            <span>
                Total Expenses
            </span>

            <strong id="expenseAmount">
                ₹0
            </strong>

        </div>


        <div class="summary-card">

            <span>
                Remaining
            </span>

            <strong id="balanceAmount">
                ₹0
            </strong>

        </div>

    </section>


    <!-- CHART + BREAKDOWN -->

    <section class="dashboard-grid">


        <div class="card chart-card">

            <p class="label">
                OVERVIEW
            </p>

            <h2>
                Salary & Expenses
            </h2>

            <div class="chart-container">

                <canvas id="expenseChart"></canvas>

            </div>

        </div>


        <div class="card">

            <div class="card-header">

                <div>

                    <p class="label">
                        BREAKDOWN
                    </p>

                    <h2>
                        Expenses
                    </h2>

                </div>

                <a href="update.html"
                   class="small-btn">
                    + Add
                </a>

            </div>


            <div id="expenseList"
                 class="items-list">
            </div>

        </div>

    </section>


</main>


<script type="module"
        src="app.js">
</script>

</body>

</html>
